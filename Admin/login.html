<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>Log in — Angithi admin</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;600&family=Kalam:wght@400&family=Young+Serif&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../css/style.css" />
    <link rel="stylesheet" href="../css/admin.css" />
  </head>
  <body>
    <main class="login" id="main">
      <form class="form" action="dashboard.html">
        <h1>Angithi admin</h1>
        <div class="field">
          <label for="u">Username</label
          ><input id="u" name="u" autocomplete="username" required />
        </div>
        <div class="field">
          <label for="p">Password</label
          ><input
            id="p"
            name="p"
            type="password"
            autocomplete="current-password"
            required
          />
        </div>
        <button class="btn" type="submit">Log in</button>
        
      </form>
    </main>
  </body>
</html>
